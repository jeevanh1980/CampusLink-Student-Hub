<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CampusLink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-logo">
                <a href="index.html">CampusLink</a>
            </div>
            <div class="nav-auth">
                <button id="nav-login" class="btn-login">Login</button>
                <button id="nav-signup" class="btn-signup">Sign Up</button>
                <button id="nav-logout" class="btn-signup" style="display: none;">Logout</button>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-form-box">
            <h2>Sign Up</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="role">I am a:</label>
                    <select id="role" required>
                        <option value="student">Student</option>
                        <option value="alumni">Alumni</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
            <p id="error-message" class="error-text"></p>
            <p class="auth-switch">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </main>
    
    <script src="register.js"></script> 
    <script src="main.js"></script> 
</body>
</html>
